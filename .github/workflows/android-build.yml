name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      # Runs ProjectBootstrap.StereoBuilder.BuildAndroid, the same method Tools/build_and_run.sh
      # calls. It writes Builds/CardboardXR.apk.
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.0f1
          targetPlatform: Android
          buildMethod: ProjectBootstrap.StereoBuilder.BuildAndroid

      - uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-apk
          path: Builds/CardboardXR.apk
          if-no-files-found: error
